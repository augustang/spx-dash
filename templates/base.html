<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}SPX Dashboard{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" />
  <script src="https://cdn.plot.ly/plotly-2.35.3.min.js" defer></script>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13" defer></script>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────── -->
<header class="spx-header">
  <div class="spx-header-left">
    <span class="header-date-group">
      <span class="header-date">{{ header.date_bold }}</span>
      <span class="header-date-rest">{{ header.date_rest }}</span>
    </span>
    <span class="header-time-group">
      <span class="header-time">{{ header.time }}</span>
      <span class="header-status">{{ header.status }}</span>
    </span>
  </div>
  <nav class="spx-nav">
    <a href="/" class="spx-nav-link {% if active_page == 'trading' %}active{% endif %}">
      Trade
      <div class="spx-nav-dot"></div>
    </a>
    <a href="/study" class="spx-nav-link {% if active_page == 'study' %}active{% endif %}">
      Study
      <div class="spx-nav-dot"></div>
    </a>
  </nav>
</header>

<!-- ── Page content ────────────────────────────────────────────────────── -->
<main>
  {% block content %}{% endblock %}
</main>

<script>
// Render any Plotly chart that arrives via HTMX. Routes return
// <div id="..." data-plotly="..." data-short="..." data-long="..."></div>
// and this handler hydrates it. We use a global afterSwap listener (instead
// of inline <script> tags) because htmx 2.x doesn't reliably re-execute
// inline scripts on every swap.

// Position strike-price pills as HTML divs overlaid on the chart.
// This is more reliable than Plotly layout.annotations, which disappear
// when uirevision changes on spread selection.
function positionStrikePills(el) {
  // Pills go into the wrapper (el.parentElement) not the Plotly div itself,
  // so they don't sit inside Plotly's DOM and can't block its hover overlay.
  var wrap = el.parentElement;
  wrap.querySelectorAll('.strike-pill').forEach(function(p) { p.remove(); });
  var short = el.dataset.short, long_ = el.dataset.long;
  if (!short || !el._fullLayout) return;

  var ly = el._fullLayout;
  var yrange = ly.yaxis.range;
  var yMin = yrange[0], yMax = yrange[1];
  // _size gives the actual plot-area rectangle in pixels (excludes margins)
  var plotTop = ly._size.t;
  var plotH = ly._size.h;

  var strikes = [
    { val: +short, color: '#3f73fa' },
    { val: +long_,  color: '#ff633d' },
  ].map(function(s) {
    var frac = (s.val - yMin) / (yMax - yMin);
    return { val: s.val, color: s.color, py: plotTop + plotH * (1 - frac) };
  });

  // Separate overlapping pills: if centres are closer than minGap px, push
  // each one away from the midpoint until they're minGap apart.
  var minGap = 16;
  var dist = strikes[1].py - strikes[0].py; // long is lower (higher index = lower price)
  if (Math.abs(dist) < minGap) {
    var mid = (strikes[0].py + strikes[1].py) / 2;
    strikes[0].py = mid - minGap / 2;
    strikes[1].py = mid + minGap / 2;
  }

  strikes.forEach(function(s) {
      // Skip if the strike is outside the visible plot area
      if (s.py < plotTop - 8 || s.py > plotTop + plotH + 8) return;
    var pill = document.createElement('div');
    pill.className = 'strike-pill';
    pill.textContent = s.val;
    pill.style.cssText = [
      'position:absolute',
      'top:' + s.py + 'px',
      'right:2px',
      'transform:translateY(-50%)',
      'background:' + s.color,
      'color:#fff',
        'font-size:8px',
        'padding:2px 4px',
        'border-radius:4px',
        'pointer-events:none',
        'font-family:Inter,sans-serif',
        'line-height:1.4',
        'letter-spacing:-0.02em',
      'z-index:10',
    ].join(';');
      wrap.appendChild(pill);
  });
}

function positionEventLabels(el) {
  var wrap = el.parentElement;
  wrap.querySelectorAll('.event-label').forEach(function(l) { l.remove(); });
  if (!el.dataset.events || !el._fullLayout) return;

  var ly      = el._fullLayout;
  var xrange  = ly.xaxis.range;
  var plotLeft = ly._size.l;
  var plotW    = ly._size.w;
  var plotTop  = ly._size.t;

  // Plotly may store date-axis range values as strings ("2025-06-15 00:00:00")
  // or as numbers (ms since epoch). Normalize to epoch ms before arithmetic.
  function toMs(v) {
    if (typeof v === 'number') return v;
    return new Date(String(v).replace(' ', 'T')).getTime();
  }
  var xMin = toMs(xrange[0]);
  var xMax = toMs(xrange[1]);

  JSON.parse(el.dataset.events).forEach(function(evt) {
    var ms   = new Date(evt.d).getTime();
    var frac = (ms - xMin) / (xMax - xMin);
    if (frac < -0.01 || frac > 1.01) return;  // off-screen, skip
    var xPx  = plotLeft + plotW * frac;

    var lbl = document.createElement('div');
    lbl.className = 'event-label';
    lbl.textContent = evt.l;
    // transform-origin: left top keeps the anchor at (xPx, plotTop-4).
    // rotate(-90deg) pivots the text upward from that point so it reads
    // bottom-to-top inside the chart's top margin.
    lbl.style.cssText = [
      'position:absolute',
      'left:' + (xPx - 4) + 'px',
      'top:' + (plotTop - 4) + 'px',
      'transform:rotate(-90deg)',
      'transform-origin:left top',
      'font-size:7px',
      'color:#AAAAAA',
      'font-family:Inter,sans-serif',
      'white-space:nowrap',
      'pointer-events:none',
      'line-height:1',
    ].join(';');
    wrap.appendChild(lbl);
  });
}

// ── Stepper buttons (+/- icons on number fields) ─────────────────────────────
document.addEventListener('click', function(e) {
  var btn = e.target.closest('[data-field][data-dir]');
  if (!btn) return;
  var input = document.getElementById(btn.dataset.field);
  if (!input) return;
  var dir = parseFloat(btn.dataset.dir);
  var floor = btn.dataset.min !== undefined ? parseFloat(btn.dataset.min) : 0;
  var val = parseFloat(input.value) || 0;
  var newVal = Math.max(floor, Math.round((val + dir) * 100) / 100);
  input.value = (Math.abs(dir) < 1) ? newVal.toFixed(2) : String(Math.round(newVal));
  var triggered = document.getElementById('triggered-field');
  if (triggered && btn.dataset.name) triggered.value = btn.dataset.name;
  input.dispatchEvent(new Event('change', { bubbles: true }));
});

// Delegated save for inputs form — survives HTMX innerHTML swaps on iOS.
// By the time this fires the stepper has already set triggered-field.value,
// so source:form naturally includes the correct _triggered value.
document.addEventListener('change', function(e) {
  var form = document.getElementById('inputs-form');
  if (!form || !form.contains(e.target)) return;
  if (e.target.type === 'hidden') return;
  // If triggered-field is still empty (direct user interaction, not stepper),
  // fill it from the input name so the backend knows which field changed.
  var trig = document.getElementById('triggered-field');
  if (trig && !trig.value && e.target.name) trig.value = e.target.name;
  htmx.ajax('POST', '/api/trading/save-inputs', {
    source: form,
    target: '#inputs-container',
    swap: 'innerHTML'
  });
  if (trig) trig.value = '';
});

// Hide Plotly's notifier and show our own custom toast instead.
(function() {
  new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      m.addedNodes.forEach(function(node) {
        if (node.nodeType !== 1) return;
        var n = node.classList.contains('plotly-notifier') ? node
              : node.querySelector && node.querySelector('.plotly-notifier');
        if (!n || n._toastHandled) return;
        n._toastHandled = true;

        // First add = Plotly is showing it for a zoom-in; hide it and show our toast
        n.style.setProperty('display', 'none', 'important');
        showZoomToast();

        // Each subsequent zoom-in Plotly reuses the same element and un-hides it
        var blocking = false;
        new MutationObserver(function() {
          if (blocking) return;
          if (n.style.display !== 'none') {
            blocking = true;
            n.style.setProperty('display', 'none', 'important');
            blocking = false;
            showZoomToast();
          }
        }).observe(n, { attributes: true, attributeFilter: ['style'] });
      });
    });
  }).observe(document.body, { childList: true, subtree: true });
})();

// Show a custom centered toast. Replaces Plotly's built-in notifier (hidden via CSS).
var _toastTimer = null;
function showToast(msg) {
  var existing = document.querySelector('.spx-toast');
  if (existing) existing.parentNode.removeChild(existing);
  if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }
  var toast = document.createElement('div');
  toast.className = 'spx-toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  _toastTimer = setTimeout(function() {
    if (toast.parentNode) toast.parentNode.removeChild(toast);
    _toastTimer = null;
  }, 3200);
}
function showZoomToast() { showToast('Double-click to zoom back out'); }

// ── Updating / confirm toast ──────────────────────────────────────────────
var _confirmTimer  = null;
var _updatingToast = null;

// Auto-poll and page-load endpoints that should not trigger the toast
var _SKIP_PATHS = ['/api/trading/metrics', '/api/trading/spreads',
                   '/api/trading/inputs',
                   // Study sections that auto-load on scroll (intersect once)
                   '/api/study/event-impact', '/api/study/key-dates',
                   '/api/study/notable-events', '/api/study/big-moves',
                   // Study sections that load on page init (load delay)
                   '/api/study/long-chart', '/api/study/intraday'];

// Endpoints that auto-poll (every Ns) — show "Refreshing data..." when
// triggered by HTMX's internal timer (triggeringEvent is null/undefined)
var _POLL_PATHS = ['/api/trading/trade', '/api/trading/day-chart',
                   '/api/trading/month-chart'];

function _isSkippedRequest(cfg) {
  var path    = (cfg || {}).path || '';
  var evtType = cfg && cfg.triggeringEvent && cfg.triggeringEvent.type;
  if (evtType === 'load' || evtType === 'intersect') return true;
  return _SKIP_PATHS.some(function(p) { return path.indexOf(p) !== -1; });
}

function _isAutoRefresh(cfg) {
  var path = (cfg || {}).path || '';
  if (!_POLL_PATHS.some(function(p) { return path.indexOf(p) !== -1; })) return false;
  // Auto-poll fires with no triggering event; user/custom events always have one
  return !cfg.triggeringEvent;
}

function _showUpdatingToast(label) {
  if (_confirmTimer) { clearTimeout(_confirmTimer); _confirmTimer = null; }
  // Already visible — leave it, no re-animation
  if (_updatingToast && document.body.contains(_updatingToast)) return;
  // Remove any existing toast (e.g. zoom toast)
  var ex = document.querySelector('.spx-toast');
  if (ex) ex.parentNode.removeChild(ex);
  var msg = label || 'Updating results';
  _updatingToast = document.createElement('div');
  _updatingToast.className = 'spx-toast spx-toast-updating';
  _updatingToast.innerHTML =
    '<span class="spx-toast-inner">' +
    msg + '<span style="display:inline-block;width:4px"></span>' +
    '<span class="spx-dot">.</span>' +
    '<span class="spx-dot">.</span>' +
    '<span class="spx-dot">.</span>' +
    '</span>';
  document.body.appendChild(_updatingToast);
}

function _showConfirmToast() {
  if (!_updatingToast || !document.body.contains(_updatingToast)) {
    _updatingToast = null;
    return;
  }
  var toast = _updatingToast;
  _updatingToast = null;
  var inner = toast.querySelector('.spx-toast-inner');
  if (!inner) return;
  // Fade out only the inner content, container stays put
  inner.style.transition = 'opacity 0.15s ease';
  inner.style.opacity = '0';
  setTimeout(function() {
    if (!document.body.contains(toast)) return;
    inner.innerHTML = 'Changes applied<span style="display:inline-block;width:4px"></span><img src="/static/icons/Interface/Check.svg" width="13" height="13" style="vertical-align:middle;margin-top:-1px">';
    inner.style.opacity = '1';
    // Dismiss whole container after 2s
    setTimeout(function() {
      toast.style.transition = 'opacity 0.2s ease';
      toast.style.opacity = '0';
      setTimeout(function() {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 200);
    }, 2000);
  }, 150);
}

// Debounce: show on any user-triggered beforeRequest; start 400ms settle
// timer on afterSettle. Aborted requests (hx-sync replace) simply never
// fire afterSettle, so they can't accidentally trigger confirm.
document.addEventListener('htmx:beforeRequest', function(e) {
  var cfg = e.detail.requestConfig;
  if (_isSkippedRequest(cfg)) return;
  _showUpdatingToast(_isAutoRefresh(cfg) ? 'Refreshing data' : 'Updating results');
});

document.addEventListener('htmx:afterSettle', function(e) {
  if (_isSkippedRequest(e.detail && e.detail.requestConfig)) return;
  if (!_updatingToast || !document.body.contains(_updatingToast)) return;
  if (_confirmTimer) clearTimeout(_confirmTimer);
  _confirmTimer = setTimeout(_showConfirmToast, 400);
});

// Dismiss the updating toast silently when a request is aborted or errors out
// (htmx:afterSettle never fires for failed requests, so the toast would get stuck).
document.addEventListener('htmx:sendError', function(e) {
  var cfg = e.detail && e.detail.requestConfig;
  if (_isSkippedRequest(cfg)) return;
  if (_confirmTimer) { clearTimeout(_confirmTimer); _confirmTimer = null; }
  if (_updatingToast && document.body.contains(_updatingToast)) {
    _updatingToast.style.transition = 'opacity 0.2s ease';
    _updatingToast.style.opacity = '0';
    var _t = _updatingToast;
    setTimeout(function() { if (_t.parentNode) _t.parentNode.removeChild(_t); }, 200);
    _updatingToast = null;
  }
});
document.addEventListener('htmx:responseError', function(e) {
  var cfg = e.detail && e.detail.requestConfig;
  if (_isSkippedRequest(cfg)) return;
  if (_confirmTimer) { clearTimeout(_confirmTimer); _confirmTimer = null; }
  if (_updatingToast && document.body.contains(_updatingToast)) {
    _updatingToast.style.transition = 'opacity 0.2s ease';
    _updatingToast.style.opacity = '0';
    var _t = _updatingToast;
    setTimeout(function() { if (_t.parentNode) _t.parentNode.removeChild(_t); }, 200);
    _updatingToast = null;
  }
});

// Cache of rendered chart elements keyed by ID. When htmx swaps a section,
// the old element (with Plotly hover state intact) is detached from DOM but
// still referenced here. On re-render we restore it and call Plotly.react
// (not newPlot), which updates data/layout without reinitialising the hover layer.
var _plotCache = {};

document.addEventListener('htmx:afterSwap', function(e) {
  e.detail.target.querySelectorAll('[data-plotly]').forEach(function(el) {
    requestAnimationFrame(function() { _renderPlotlyEl(el); });
  });
});

// Named so the retry path can call it without capturing stale closures.
function _renderPlotlyEl(el) {
  if (typeof Plotly === 'undefined') {
    setTimeout(function() { _renderPlotlyEl(el); }, 50);
    return;
  }

  // Restore cached element so Plotly.react can diff without losing hover state.
  var cached = _plotCache[el.id];
  if (cached && cached !== el && cached._fullLayout && !document.body.contains(cached)) {
    if (el.parentNode) el.parentNode.replaceChild(cached, el);
    // Sync all chart-relevant data attributes so strike pills and event
    // labels always reflect the freshly rendered element (not stale cache).
    ['plotly', 'short', 'long', 'events'].forEach(function(key) {
      if (el.dataset[key] !== undefined) {
        cached.dataset[key] = el.dataset[key];
      } else {
        delete cached.dataset[key];
      }
    });
    el = cached;
  }
  if (!document.body.contains(el)) return;

  try {
    var isUpdate = !!(el._fullLayout);
    var plotFn = isUpdate ? Plotly.react : Plotly.newPlot;
    var fig = JSON.parse(el.dataset.plotly);
    fig.layout.autosize = true;
    plotFn(el, fig.data, fig.layout, { displayModeBar: false });
    _plotCache[el.id] = el;
    positionStrikePills(el);
    positionEventLabels(el);
    if (!isUpdate) {
      el.on('plotly_relayout', function() { positionStrikePills(el); positionEventLabels(el); });
      el.on('plotly_afterplot', function() { positionStrikePills(el); positionEventLabels(el); });
    }
  } catch (err) {
    console.error('Plotly render failed', err, el);
  }
}

// Delegated listener for the intraday date picker so it survives HTMX swaps.
// Handles mobile browsers (iOS Safari) where re-attached hx-trigger="change"
// on a swapped element is unreliable.
document.addEventListener('change', function(e) {
  if (e.target && e.target.id === 'intraday-date') {
    htmx.ajax('GET', '/api/study/intraday', {
      target: '#intraday-content',
      swap: 'innerHTML',
      values: { date: e.target.value }
    });
  }
});

// Initialise flatpickr on any input marked with [data-flatpickr]. Re-runs after
// every HTMX swap so newly-rendered date fields get the picker too. altInput
// keeps the underlying value as ISO YYYY-MM-DD (which the backend expects)
// while showing "Mar 20, 2026" to the user.
function _initFlatpickrs(root) {
  if (typeof flatpickr === 'undefined') return;
  (root || document).querySelectorAll('input[data-flatpickr]').forEach(function(el) {
    if (el._flatpickr) return;
    var origClass = el.className || '';
    var origStyle = el.getAttribute('style') || '';
    var origSize  = el.getAttribute('size');
    var fp = flatpickr(el, {
      dateFormat: "Y-m-d",
      altInput: true,
      altInputClass: origClass,
      altFormat: "M j, Y",
      allowInput: true,
    });
    if (fp && fp.altInput) {
      if (origStyle) fp.altInput.setAttribute('style', origStyle);
      if (origSize)  fp.altInput.setAttribute('size', origSize);
    }
  });
}
document.addEventListener('DOMContentLoaded', function() { _initFlatpickrs(document); });
document.body.addEventListener('htmx:afterSwap', function(e) { _initFlatpickrs(e.detail.target); });
</script>

</body>
</html>
