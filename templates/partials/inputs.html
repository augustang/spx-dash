<!-- Inputs partial — re-rendered only when POST /api/trading/save-inputs returns -->
<form id="inputs-form" class="inputs-form"
      hx-post="/api/trading/save-inputs"
      hx-target="#inputs-container"
      hx-swap="innerHTML">

  <input type="hidden" name="_triggered" id="triggered-field" value="" />

  <!-- Buying power + spread width -->
  <div class="row-2col" style="margin-top:28px">
    <div>
      <label class="field-label">Buying power ($)</label>
      <div class="num-field-row">
        <input id="input-bp" name="bp" type="number" value="{{ saved_bp|int }}"
               class="num-field-input" />
        <div class="icon-btn-group">
          <button type="button" class="icon-btn" data-field="input-bp" data-dir="-10000" data-name="bp">
            <img src="/static/icons/Edit/Remove_Minus.svg" width="16" height="16" />
          </button>
          <button type="button" class="icon-btn" data-field="input-bp" data-dir="+10000" data-name="bp">
            <img src="/static/icons/Edit/Add_Plus.svg" width="16" height="16" />
          </button>
        </div>
      </div>
    </div>
    <div>
      <label class="field-label">Spread width</label>
      <select name="sw" id="input-spread-width"
              class="figma-dropdown">
        {% for w in [10, 25, 50, 100] %}
        <option value="{{ w }}" {% if w == saved_spread|int %}selected{% endif %}>{{ w }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <!-- Contracts + target -->
  <div class="row-2col" style="margin-top:24px">
    <div>
      <label class="field-label">Contracts</label>
      <div class="num-field-row">
        <input id="input-contracts" name="contracts" type="number" value="{{ saved_contracts|int }}"
               class="num-field-input" />
        <div class="icon-btn-group">
          <button type="button" class="icon-btn" data-field="input-contracts" data-dir="-1" data-name="contracts">
            <img src="/static/icons/Edit/Remove_Minus.svg" width="16" height="16" />
          </button>
          <button type="button" class="icon-btn" data-field="input-contracts" data-dir="+1" data-name="contracts">
            <img src="/static/icons/Edit/Add_Plus.svg" width="16" height="16" />
          </button>
        </div>
      </div>
    </div>
    <div>
      <label class="field-label">Target profit ($)</label>
      <div class="num-field-row">
        <input id="input-target" name="target" type="number" value="{{ saved_target|int }}"
               class="num-field-input" />
        <div class="icon-btn-group">
          <button type="button" class="icon-btn" data-field="input-target" data-dir="-100" data-name="target">
            <img src="/static/icons/Edit/Remove_Minus.svg" width="16" height="16" />
          </button>
          <button type="button" class="icon-btn" data-field="input-target" data-dir="+100" data-name="target">
            <img src="/static/icons/Edit/Add_Plus.svg" width="16" height="16" />
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden state needed by save-inputs (entry/close are edited elsewhere) -->
  <input type="hidden" name="entry" value="{{ saved_entry }}" />
  <input type="hidden" name="close" value="{{ saved_close }}" />
</form>
